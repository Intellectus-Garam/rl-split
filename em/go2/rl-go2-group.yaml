# Go2 learner and both workers as one unit: any member ending restarts all three (1-1, 1-2, 1-3, 1-5).
apiVersion: int2connex.io/v1
kind: TaskGroup
metadata:
  name: rl-go2-group
spec:
  lifecycle:
    restartPolicy: all-or-nothing
    shutdownOrder: reverse
  executionStrategy:
    mode: parallel
  tasks:
    - name: learner
      taskRef: rl-go2-learner
    - name: worker-0
      taskRef: rl-go2-worker-0
    - name: worker-1
      taskRef: rl-go2-worker-1
