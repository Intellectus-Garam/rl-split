# Dummy learner on Spark A. Runs long enough for the kill scenarios (1-1, 1-2, 1-3, 1-6).
# Paths are absolute because the task starts in em-worker's working directory (/).
# Runs as root like em-worker.
apiVersion: int2connex.io/v1
kind: PrimitiveTask
metadata:
  name: rl-dummy-learner
  labels:
    domain: rl-split
spec:
  executionType: native
  executable:
    binary: /home/int2/Workspace/rl-split/.venv/bin/python
    env:
      PYTHONPATH: /home/int2/Workspace/int2DDS/python
      PYTHONUNBUFFERED: "1"
      INT2DDS_MAX_MESSAGE_SIZE: "1344"
      INT2DDS_DATA_FRAG_SIZE: "1344"
    args:
      - /home/int2/Workspace/rl-split/scripts/dummy/learner.py
      - --mode
      - local
      - --num_workers
      - "2"
      - --max_iterations
      - "100000"
  placement:
    nodeSelector:
      em.io/node: promaxgb10-cc43
  native:
    scheduling:
      policy: SCHED_OTHER
