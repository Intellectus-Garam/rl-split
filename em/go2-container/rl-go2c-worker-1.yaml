# Go2 worker 1 on Spark B as a container. Both workers share the GPU, half each.
apiVersion: int2connex.io/v1
kind: PrimitiveTask
metadata:
  name: rl-go2c-worker-1
  labels:
    domain: rl-split
spec:
  executionType: container
  executable:
    binary: rl-split:0.1
    env:
      INT2DDS_MAX_MESSAGE_SIZE: "1344"
      INT2DDS_DATA_FRAG_SIZE: "1344"
      INT2DDS_EXTERNAL_ADDRESS: 192.168.0.210
    args:
      - worker
      - --mode
      - local
      - --worker_id
      - "1"
  container:
    resources:
      gpu:
        share: 0.5
    kubernetes:
      nodeSelector:
        kubernetes.io/hostname: zgx-cde9
      hostNetwork: true
